name: Supabase database

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start local Supabase
        run: supabase start

      - name: Replay migrations from scratch
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Lint database
        run: supabase db lint --local --schema public --level warning --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy production migrations
    needs: database
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false

    env:
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration history
        run: supabase migration list --linked

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked --yes

      - name: Show deployed migration history
        run: supabase migration list --linked
